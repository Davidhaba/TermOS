    let iDBFS, fileSystem, desktop;
    window.openApplications = [];

    class IndexedDBFileSystem {
      constructor() {
        this.FS_DB_NAME = 'TermOS';
        this.FS_DB_VERSION = 1;
        this.FS_STORE_NAME = 'filesystem';
        this.FS_IDB_KEY = 'savefs';
      }
      open() {
        return new Promise((resolve, reject) => {
          if (!window.indexedDB) {
            reject(new Error('IndexedDB is not available'));
            return;
          }
          const request = indexedDB.open(this.FS_DB_NAME, this.FS_DB_VERSION);
          request.onupgradeneeded = () => {
            const db = request.result;
            if (!db.objectStoreNames.contains(this.FS_STORE_NAME)) {
              db.createObjectStore(this.FS_STORE_NAME);
            }
          };
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error);
        });
      }
      async load() {
        const idbData = await this.read();
        if (idbData && idbData !== null) {
          return idbData;
        }
        try {
          const raw = localStorage.getItem('savefs');
          return raw ? JSON.parse(raw) : null;
        } catch {
          return null;
        }
      }
      async read() {
        try {
          const db = await this.open();
          return await new Promise((resolve, reject) => {
            const tx = db.transaction(this.FS_STORE_NAME, 'readonly');
            const store = tx.objectStore(this.FS_STORE_NAME);
            const request = store.get(this.FS_IDB_KEY);
            request.onsuccess = () => resolve(request.result ?? null);
            request.onerror = () => reject(request.error);
            tx.oncomplete = () => db.close();
            tx.onerror = () => reject(tx.error);
          });
        } catch {
          return null;
        }
      }
      async write(data) {
        try {
          const db = await this.open();
          return await new Promise((resolve, reject) => {
            const tx = db.transaction(this.FS_STORE_NAME, 'readwrite');
            const store = tx.objectStore(this.FS_STORE_NAME);
            const request = store.put(data, this.FS_IDB_KEY);
            request.onsuccess = () => resolve(true);
            request.onerror = () => reject(request.error);
            tx.oncomplete = () => db.close();
            tx.onerror = () => reject(tx.error);
          });
        } catch {
          return false;
        }
      }
      async save(data) {
        const saved = await this.write(data);
        if (!saved) {
          try {
            localStorage.setItem('savefs', JSON.stringify(data));
            return true;
          } catch {
            return false;
          }
        }
        return true;
      }
    }
    window.onload = async () => {
      if (username === 'Sololearn') alert("!! Welcome to TermOS !! \n\nThis is a complete web operating system. Explore the terminal, file system, and applications. Feel free to share feedback and suggestions—they help improve the OS! \n\nThanks for trying TermOS!");
      else if (username === '') {
        alert("System Maintenance\n\nTermOS is currently undergoing maintenance. Please try again in a few minutes.");
        return;
      }
      iDBFS = new IndexedDBFileSystem();
      fileSystem = await FileSystem.create();
      desktop = new Desktop();
      new Terminal();
    }
    async function copyText(text) {
      let copySuccess = false;
      if (navigator.clipboard && navigator.clipboard.writeText) {
        try {
          await navigator.clipboard.writeText(text);
          copySuccess = true;
        } catch {
          copySuccess = false;
        }
      }
      if (!copySuccess) {
        const textArea = document.createElement('textarea');
        textArea.value = text;
        document.body.appendChild(textArea);
        textArea.select();
        try {
          if (document.execCommand('copy')) {
            copySuccess = true;
          }
        } catch {
          copySuccess = false;
        }
        document.body.removeChild(textArea);
      }
      return copySuccess;
    }
    class FileSystemClone {
      constructor() {
        this.root = fileSystem.globalRoot;
        const homeDir = this.root.children.find(d => d.name === 'home' && d.type === 'directory');

      hideGridOverlay() {
        if (this.gridOverlay) {
          this.gridOverlay.style.display = 'none';
          this.gridOverlay.innerHTML = '';
        }
      }
      handleDesktopTouchStart(e) {
        const icon = e.target.closest('.desktop-icon');
        const touch = e.touches[0];
        this.touchStartX = touch.clientX;
        this.touchStartY = touch.clientY;
        this.isTouchDragging = false;
        this.touchTargetIcon = icon || null;
        if (icon) {
          icon.draggable = false;
        }
        this.closeContextMenu();
        this.hideGridOverlay();
        this.pendingTouchContextMenu = false;
        if (this.touchTimer) {
          clearTimeout(this.touchTimer);
        }
        this.touchTimer = setTimeout(() => {
          if (!this.isTouchDragging) {
            this.pendingTouchContextMenu = true;
            this.showContextMenu(e);
          }
        }, 500);
        if (icon) {
          const icons = Array.from(this.desktop.querySelectorAll('.desktop-icon'));
          const currentIndex = icons.indexOf(icon);
          if (this.selectedIcons.has(icon)) {
            this.lastSelectedIndex = currentIndex;
          } else {
            this.clearSelection();
            this.selectedIcons.add(icon);
            this.lastSelectedIndex = currentIndex;
          }
          this.desktop.querySelectorAll('.desktop-icon').forEach(i => {
            i.classList.toggle('selected', this.selectedIcons.has(i));
          });
          this.draggedIcon = icon;
        }
      }
      handleDesktopTouchMove(e) {
        if (!this.touchTimer && !this.isTouchDragging) return;
        const touch = e.touches[0];
        const dx = touch.clientX - this.touchStartX;
        const dy = touch.clientY - this.touchStartY;
        const distance = Math.sqrt(dx * dx + dy * dy);
        if (this.touchTimer && !this.isTouchDragging && distance > 10) {
          e.preventDefault();
          clearTimeout(this.touchTimer);
          this.touchTimer = null;
          this.isTouchDragging = true;
          this.closeContextMenu();
          this.hideGridOverlay();
          if (this.draggedIcon && this.selectedIcons.has(this.draggedIcon)) {
            this.draggedIcons = Array.from(this.desktop.querySelectorAll('.desktop-icon')).filter(icon => this.selectedIcons.has(icon));
            this.draggedIcons.forEach(icon => icon.classList.add('dragging'));
            this.showGridOverlay();
          }
        }
        if (this.isTouchDragging && this.draggedIcons.length > 0) {
          e.preventDefault();
          const { desktopRect, paddingLeft, paddingTop, rowGap, columnGap, cellSize, rows } = this.getDesktopGridMetrics();
          const dropX = Math.max(0, touch.clientX - desktopRect.left - paddingLeft / 2);
          const dropY = Math.max(0, touch.clientY - desktopRect.top - paddingTop);
          const nonDraggedIcons = Array.from(this.desktop.querySelectorAll('.desktop-icon')).filter(icon => !this.draggedIcons.includes(icon));
          const columns = Math.max(1, Math.floor(desktopRect.width / (cellSize + columnGap)));
          const targetIndex = this.getClosestCellIndex(dropX, dropY, columns, rows, cellSize, columnGap, rowGap);
          const occupied = this.getOccupiedCellIndexes(nonDraggedIcons, rows);
          let targetCellIndex = this.findNextFreeCell(targetIndex, occupied, rows, columns);
          this.draggedIcons.forEach((icon, idx) => {
            let cellIndex = this.findNextFreeCell(targetCellIndex + idx, occupied, rows, columns);
            const col = Math.floor(cellIndex / rows);
            const row = cellIndex % rows;
            icon.style.gridColumnStart = String(col + 1);
            icon.style.gridRowStart = String(row + 1);
          });
        }
      }
      handleDesktopTouchEnd(e) {
        const icon = this.touchTargetIcon;
        if (icon) {
          icon.draggable = true;
        }
        if (this.touchTimer) {
          clearTimeout(this.touchTimer);
          this.touchTimer = null;
        }
        if (this.isTouchDragging) {
          this.selectedIcons.forEach(i => i.classList.remove('dragging'));
          this.saveDesktopIconPositions();
          this.draggedIcon = null;
          this.draggedIcons = [];
          this.hideGridOverlay();
          this.isTouchDragging = false;
          this.lastTapTime = 0;
          this.lastTapIcon = null;
          this.touchTargetIcon = null;
          return;
        }
        if (icon) {
          const currentTapTime = Date.now();
          const isDoubleTap = this.lastTapIcon === icon && (currentTapTime - this.lastTapTime) <= 350;
          if (isDoubleTap) {
            e.preventDefault();
            e.stopPropagation();
            this.lastTapTime = 0;
            this.lastTapIcon = null;
            this.lastTouchOpenedIcon = icon;
            this.lastTouchOpenedTime = currentTapTime;
            this.handleDblClick(JSON.parse(icon.dataset.item));
            this.touchTargetIcon = null;
            return;
          }
          this.lastTapTime = currentTapTime;
          this.lastTapIcon = icon;
          this.clearSelection();
          this.selectedIcons.add(icon);
          icon.classList.add('selected');
        }
        this.touchTargetIcon = null;
      }
      showContextMenu(e) {
        e.preventDefault?.();
        e.stopPropagation?.();
        if (this.contextMenu) {
          this.contextMenu.remove();
        }

        const clickedIcon = e.target.closest('.desktop-icon');
        if (clickedIcon && !this.selectedIcons.has(clickedIcon)) {
          this.clearSelection();
          this.selectedIcons.add(clickedIcon);
          clickedIcon.classList.add('selected');
        }

        const isDesktopTarget = !clickedIcon;
        const selectedItems = Array.from(this.selectedIcons);
        const selectionCount = selectedItems.length;
        const single = !isDesktopTarget && selectionCount === 1;
        let mainItem = null;
        if (single) {
          mainItem = JSON.parse(selectedItems[0].dataset.item);
        }
        const isFolder = single && (mainItem.type === 'directory' || (mainItem.type === 'link' && fileSystem._resolvePath(mainItem.target)?.type === 'directory'));
        const isLink = single && mainItem.type === 'link';
        const clipboardData = JSON.parse(StorageManager.getItem('fileExplorerClipboard') || 'null');
        const hasClipboard = clipboardData && clipboardData.paths && clipboardData.paths.length > 0;

        const items = [];

        if (isDesktopTarget) {
          if (hasClipboard) {
            items.push({
              iconHtml: icons.paste,
              label: 'Paste',
              className: 'paste',
              onClick: () => {
                this.pasteSelectedIcons();
                this.closeContextMenu();
              }
            });
            items.push({ isSeparator: true });
          }
          items.push({
            iconHtml: icons.newFolder,
            label: 'New Folder',
            className: 'new-folder',
            onClick: () => {
              this.closeContextMenu();
              let newName = "New Folder";
              let counter = 0;
              const files = fileSystem.ls('/bin/desktop');
              while (files.some(item => item.name === newName)) {
                counter++;
                newName = `New Folder (${counter})`;
              }
              try {
                fileSystem.mkdir('/bin/desktop', newName);
                this.renamingIconName = newName;
                this.refreshDesktop();
              } catch (error) {
                new Dialog('Error', 'Failed to create folder', error.message, 'error', ['OK'], 'OK');
              }
              this.closeContextMenu();
            }
          });
          items.push({
            iconHtml: icons.newFile,
            label: 'New File',
            className: 'new-file',
            onClick: () => {
              this.closeContextMenu();
              let newName = "New File.txt";
              let counter = 0;
              const files = fileSystem.ls('/bin/desktop');
              while (files.some(item => item.name === newName)) {
                counter++;
                newName = `New File (${counter}).txt`;
              }
              try {
                fileSystem.touch('/bin/desktop', newName);
                this.renamingIconName = newName;
                this.refreshDesktop();
              } catch (error) {
                new Dialog('Error', 'Failed to create file', error.message, 'error', ['OK'], 'OK');
              }
              this.closeContextMenu();
            }
          });
          items.push({
            iconHtml: icons.copy,
            label: 'Copy Path',
            className: 'copyPath',
            onClick: () => {
              this.copyCurrentDesktopPath();
              this.closeContextMenu();
            }
          });
          items.push({ isSeparator: true });
          items.push({
            iconHtml: icons.refresh,
            label: 'Refresh',
            className: 'refresh',
            onClick: () => {
              this.closeContextMenu();
              this.refreshDesktop();
            }
          });
        } else {
          const openLabel = isFolder ? 'Open Folder' : 'Open File';
          const openIcon = isFolder ? icons.openFolder : single ? icons.openFile : icons.open;
          items.push({
            iconHtml: openIcon,
            label: openLabel,
            className: 'open',
            onClick: () => {
              selectedItems.forEach(item => this.handleDblClick(JSON.parse(item.dataset.item)));
              this.closeContextMenu();
            }
          });
          items.push({
            iconHtml: icons.copy,
            label: 'Copy',
            className: 'copy',
            onClick: () => {
              this.copySelectedIcons();
              this.closeContextMenu();
            }
          });
          items.push({
            iconHtml: icons.cut,
            label: 'Cut',
            className: 'cut',
            onClick: () => {
              this.cutSelectedIcons();
              this.closeContextMenu();
            }
          });
          items.push({
            iconHtml: icons.copy,
            label: `Copy Path${selectionCount > 1 ? 's' : ''}`,
            className: 'copyPath',
            onClick: () => {
              this.copySelectedIconPaths();
              this.closeContextMenu();
            }
          });
          if (single) {
            items.push({
              iconHtml: icons.rename,
              label: 'Rename',
              className: 'rename',
              onClick: () => {
                this.renameIcon(selectedItems[0]);
                this.closeContextMenu();
              }
            });
          }
          items.push({
            iconHtml: icons.delete,
            label: 'Delete',
            className: 'delete',
            onClick: () => {
              this.deleteSelectedIcons();
              this.closeContextMenu();
            }
          });
        }

        this.contextMenu = ContextMenuBuilder.renderMenu({
          event: e,
          headerIconHtml: isDesktopTarget ? icons.desktop : (single ? (isFolder ? icons.folder : (isLink ? icons.shortcut : this.getIconForFileType(fileSystem.getFileType(mainItem.name).type))) : icons.files),
          headerLabelText: isDesktopTarget ? 'Desktop' : (single ? mainItem.displayName : 'Selected items'),
          headerBadge: (!isDesktopTarget && !single) ? selectionCount.toString() : '',
          items,
          appendTo: document.body
        });

        setTimeout(() => {
          document.addEventListener('click', () => this.closeContextMenu(), { once: true });
        }, 0);
      }
      refreshDesktop() {
        const selectedIconNames = this.getSelectedIconNames();
        this.desktop.innerHTML = '';
        this.selectedIcons.clear();
        this.ctrlSelectedIcons.clear();
        this.loadDesktopShortcuts();
        this.restoreSelectedIcons(selectedIconNames);
      }
      getSelectedIconNames() {
        return Array.from(this.selectedIcons).map(icon => {
          const item = JSON.parse(icon.dataset.item);
          return item.name;
        });
      }
      restoreSelectedIcons(iconNames) {
        if (!iconNames || iconNames.length === 0) return;
        const iconSet = new Set(iconNames);
        this.desktop.querySelectorAll('.desktop-icon').forEach(icon => {
          const item = JSON.parse(icon.dataset.item);
          if (iconSet.has(item.name)) {
            this.selectedIcons.add(icon);
            icon.classList.add('selected');
          }
        });
      }
      getDesktopSelectedPaths() {
        return Array.from(this.selectedIcons).map(icon => {
          const shortcut = JSON.parse(icon.dataset.item);
          return fileSystem.getResolvedPath('/bin/desktop', shortcut.name)[0];
        });
      }
      copySelectedIcons() {
        const paths = this.getDesktopSelectedPaths();
        if (paths.length === 0) return;
        const clipboardData = { type: 'copy', paths, source: '/bin/desktop' };
        StorageManager.setItem('fileExplorerClipboard', JSON.stringify(clipboardData));
      }
      cutSelectedIcons() {
        const paths = this.getDesktopSelectedPaths();
        if (paths.length === 0) return;
        const clipboardData = { type: 'cut', paths, source: '/bin/desktop' };
        StorageManager.setItem('fileExplorerClipboard', JSON.stringify(clipboardData));
      }
      async pasteSelectedIcons() {
        const clipboardData = JSON.parse(StorageManager.getItem('fileExplorerClipboard') || 'null');
        if (!clipboardData || !clipboardData.paths || clipboardData.paths.length === 0) return;
        const { type, paths } = clipboardData;
        const errors = [];
        const successes = [];

        for (const sourcePath of paths) {
          const fileName = sourcePath.split('/').pop();
          try {
            const targetPath = fileSystem.getResolvedPath('/bin/desktop', fileName)[0];
            if (sourcePath === targetPath) {
              if (type === 'cut') {
                successes.push(fileName);
                continue;
              }
              throw new Error('Source and destination are the same');
            }
            if (type === 'copy') {
              fileSystem.cp(sourcePath, targetPath);
            } else if (type === 'cut') {
              fileSystem.mv(sourcePath, targetPath);
            }
            successes.push(fileName);
          } catch (e) {
            errors.push({ file: fileName, error: e.message });
          }
        }

        if (type === 'cut' && successes.length === paths.length) {
          StorageManager.removeItem('fileExplorerClipboard');
        }

        if (errors.length > 0) {
          const errorList = errors.map(e => `<br>• ${e.file}: ${e.error}`).join('\n');
          new Dialog('Desktop - Paste Errors', `${successes.length} of ${paths.length} items pasted successfully.`, `Errors:${errorList}`, 'warning', ['Ok'], 'Ok');
        }
        this.refreshDesktop();
      }
      copySelectedIconPaths() {
        const paths = this.getDesktopSelectedPaths();
        if (paths.length === 0) return;
        copyText(paths.join('\n'));
      }
      copyCurrentDesktopPath() {
        copyText('/bin/desktop');
      }
      renderContextMenuAtEvent(e) {
        document.body.appendChild(this.contextMenu);
        const touchPoint = (e.touches && e.touches[0]) || (e.changedTouches && e.changedTouches[0]);
        const clientX = typeof e.clientX === 'number' ? e.clientX : (touchPoint ? touchPoint.clientX : window.innerWidth / 2);
        const clientY = typeof e.clientY === 'number' ? e.clientY : (touchPoint ? touchPoint.clientY : window.innerHeight / 2);
        const x = Math.max(0, Math.min(clientX, window.innerWidth - this.contextMenu.offsetWidth));
        const y = Math.max(0, Math.min(clientY, window.innerHeight - this.contextMenu.offsetHeight));
        this.contextMenu.style.left = x + 'px';
        this.contextMenu.style.top = y + 'px';
        setTimeout(() => {
          document.addEventListener('click', () => this.closeContextMenu(), { once: true });
        }, 0);
      }
      closeContextMenu() {
        if (this.contextMenu) {
          this.contextMenu.remove();
          this.contextMenu = null;
        }
      }
      renameIcon(icon) {
        if (!icon) return;
        const shortcut = JSON.parse(icon.dataset.item);
        if (!shortcut) return;
        this.renamingIconName = shortcut.name;
        this.refreshDesktop();
      }
      clearSelection() {
        this.desktop.querySelectorAll('.desktop-icon').forEach(i => i.classList.remove('selected'));
        this.selectedIcons.clear();
        this.ctrlSelectedIcons.clear();
        this.lastSelectedIndex = -1;
      }
      setupEventListeners() {
        this.desktop.addEventListener('click', (e) => {
          if (e.target === this.desktop) {
            if (!e.ctrlKey && !e.shiftKey) this.clearSelection();
            this.closeContextMenu();
            this.setActiveDesktop();
          }
        });

        this.desktop.addEventListener('dragover', (e) => {
          if (e.target === this.desktop) this.handleDragOver(e);
        });

        this.desktop.addEventListener('drop', (e) => {
          if (e.target === this.desktop) this.handleDrop(e, null);
        });

        this.desktop.addEventListener('touchstart', (e) => this.handleDesktopTouchStart(e), { passive: false });
        this.desktop.addEventListener('touchmove', (e) => this.handleDesktopTouchMove(e), { passive: false });
        this.desktop.addEventListener('touchend', (e) => this.handleDesktopTouchEnd(e), { passive: false });
        this.desktop.addEventListener('touchcancel', (e) => this.handleDesktopTouchEnd(e), { passive: false });

        this.desktop.addEventListener('contextmenu', (e) => {
          if (this.pendingTouchContextMenu) {
            e.preventDefault();
            e.stopPropagation();
            this.pendingTouchContextMenu = false;
            return;
          }
          e.preventDefault();
          this.showContextMenu(e);
        });

        this.desktop.addEventListener('keydown', () => {
          this.setActiveDesktop();
        });

        document.addEventListener('keydown', async (e) => {
          if (!this.desktop.classList.contains('active')) return;
          if (e.key === 'F2') {
            e.preventDefault();
            this.renameIcon(Array.from(this.selectedIcons)[0]);
          }
          if (e.key === 'Delete') {
            this.deleteSelectedIcons();
          }
          if (e.ctrlKey && e.code === 'KeyA') {
            e.preventDefault();
            this.desktop.querySelectorAll('.desktop-icon').forEach(icon => {
              this.selectedIcons.add(icon);
              icon.classList.add('selected');
            });
          }
        });
      }

      setActiveDesktop() {
        document.querySelectorAll('.modal-window').forEach(w => {
          w.classList.remove('active');
        });
        this.desktop.classList.add('active');
        this.desktop.focus();
      }
      async deleteSelectedIcons() {
        const selectedIcons = Array.from(this.selectedIcons);
        if (selectedIcons.length <= 0) return;
        const confirm = await new Dialog("Confirm Delete", `Are you sure you want to delete ${selectedIcons.length} item${selectedIcons.length === 1 ? '' : 's'}?`, "This action cannot be undone.", "warning", ['Delete', 'Cancel'], 'Cancel');
        if (!confirm || confirm !== 'Delete') return;
        selectedIcons.forEach(icon => {
          const shortcut = JSON.parse(icon.dataset.item);
          try {
            const [path, args] = fileSystem.getResolvedPath('/bin/desktop/', shortcut.name);
            fileSystem.rm(path + (args ? ` ${args}` : ''), true);
            icon.remove();
            this.selectedIcons.delete(icon);
          } catch (e) {
            new Dialog("Error", `Failed to delete '${shortcut.displayName}'`, e.message, "error", ['OK'], 'OK');
          }
        });
      }
    }
  </script>

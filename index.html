    class IndexedDBFileSystem {
      constructor() {
        this.FS_DB_NAME = 'TermOS';
        this.FS_DB_VERSION = 1;
        this.FS_STORE_NAME = 'filesystem';
        this.FS_IDB_KEY = 'savefs';
      }
      open() {
        return new Promise((resolve, reject) => {
          if (!window.indexedDB) {
            reject(new Error('IndexedDB is not available'));
            return;
          }
          const request = indexedDB.open(this.FS_DB_NAME, this.FS_DB_VERSION);
          request.onupgradeneeded = () => {
            const db = request.result;
            if (!db.objectStoreNames.contains(this.FS_STORE_NAME)) {
              db.createObjectStore(this.FS_STORE_NAME);
            }
          };
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error);
        });
      }
      async load() {
        const idbData = await this.read();
        if (idbData !== null) {
          return idbData;
        }
        try {
          const raw = localStorage.getItem('savefs');
          return raw ? JSON.parse(raw) : null;
        } catch {
          return null;
        }
      }
      async read() {
        try {
          const db = await this.open();
          return await new Promise((resolve, reject) => {
            const tx = db.transaction(this.FS_STORE_NAME, 'readonly');
            const store = tx.objectStore(this.FS_STORE_NAME);
            const request = store.get(this.FS_IDB_KEY);
            request.onsuccess = () => resolve(request.result ?? null);
            request.onerror = () => reject(request.error);
            tx.oncomplete = () => db.close();
            tx.onerror = () => reject(tx.error);
          });
        } catch {
          return null;
        }
      }
      async write(data) {
        try {
          const db = await this.open();
          return await new Promise((resolve, reject) => {
            const tx = db.transaction(this.FS_STORE_NAME, 'readwrite');
            const store = tx.objectStore(this.FS_STORE_NAME);
            const request = store.put(data, this.FS_IDB_KEY);
            request.onsuccess = () => resolve(true);
            request.onerror = () => reject(request.error);
            tx.oncomplete = () => db.close();
            tx.onerror = () => reject(tx.error);
          });
        } catch {
          return false;
        }
      }

        const saved = await this.write(data);

            localStorage.setItem('savefs', JSON.stringify(data));
            return true;
          } catch {
            return false;
          }
        }

      }

        } catch {
          copySuccess = false;
        }

        try {
          if (document.execCommand('copy')) {

            try {
              const file = this._resolvePath(path);
              if (!file || file.type !== 'file') {
                throw new Error(`File not found: ${path}`);
              }
              if (file.parameters.encoding === 'binary') {
                resolve(new Blob([file.content]));
              } else {
                resolve(file.content);
              }
            } catch (e) {
              reject(e);
            }
          }, 0);
        });
      }
      createDirectory(name, parameters = { isSystem: false }) {
        if (!this._validateName(name)) {
          throw new Error(`Invalid directory name: ${name}`);
        }
        return {
          name,
          type: 'directory',
          children: [],
          parameters
        };
      }
      createFile(name, content = '', parameters = {}) {
        if (!this._validateName(name)) {
          throw new Error(`Invalid file name: ${name}`);
        }
        const finalParameters = { ...{ isBinary: false, isSystem: false, encoding: "UTF-8" }, ...parameters };
        return {
          name,
          type: 'file',
          content: finalParameters.isBinary ? new Uint8Array(content) : String(content),
          parameters: finalParameters,
        };
      }
      createLink(name, target = '', parameters = {}) {
        if (!this._validateName(name)) {
          throw new Error(`Invalid link name: ${name}`);
        }
        const finalParameters = { ...{ isSystem: false }, ...parameters };
        return {
          name,
          type: 'link',
          target: String(target),
          parameters: finalParameters,
        };
      }
      _validateName(name) {
        name = name.trim();
        if (name.includes('/') || name === '.' || name === '..') return false;
        return true;
      }
      ls(path) {
        const resolved = this._resolvePath(path);
        if (resolved) {
          return resolved.children;
        } else {
          throw new Error("Path not found");
          return null;
        }
      }
      mkdirp(path) {
        const parts = path.split('/').filter(p => p);
        let current = this.globalRoot;
        for (const part of parts) {
          let dir = current.children.find(d => d.name === part && d.type === 'directory');
          if (!dir) {
            dir = this.createDirectory(part);
            current.children.push(dir);
          }
          current = dir;
        }
        return current;
      }
      mkdir(currentPath, name) {
        const targetDir = this._resolvePath(currentPath);
        if (!targetDir || targetDir.type !== 'directory') {
          throw new Error('Invalid path to create directory');
        }
        if (!this.exists(targetDir.children, name)) {
          const newDir = this.createDirectory(name);
          return targetDir.children.push(newDir);
        }
        return false;
      }
      exists(children, name, type = null) {
        return children.some(item => item.name === name && (type == null || item.type === type));
      }
      findIndex(children, name) {
        return children.findIndex(item => item.name === name);
      }
      cd(currentPath, newPath) {
        if (typeof newPath !== 'string') {
          throw new Error('Path must be a string');
        }
        if (newPath === '/') {
          return '/';
        }
        let targetPath;
        if (newPath.startsWith('/')) {
          targetPath = newPath;
        } else {
          const parts = currentPath.split('/').filter(p => p);
          const newPathParts = newPath.split('/');
          for (const part of newPathParts) {
            if (part === '..') {
              if (parts.length > 0) {
                parts.pop();
              }
            } else if (part !== '.' && part !== '') {
              parts.push(part);
            }
          }
          targetPath = '/' + parts.join('/');
        }
        const targetDir = this._resolvePath(targetPath);
        if (targetDir && targetDir.type === 'directory') {
          return targetPath;
        }
        throw new Error("Directory not found");
      }
      _findParent(targetNode, startNode = this.globalRoot) {
        if (startNode === targetNode) return null;

        const queue = [startNode];
        while (queue.length > 0) {
          const current = queue.shift();
          for (const child of current.children) {
            if (child === targetNode) {
              return current;
            }
            if (child.type === 'directory') {
              queue.push(child);
            }
          }
        }
        return null;
      }
      getResolvedPath(fullPath, path) {
        const [cleanPath] = this._splitPathAndArgs(path);
        if (!cleanPath || cleanPath === '/' || cleanPath.startsWith('/')) {
          return cleanPath;
        }
        const parts = fullPath.split('/').filter(p => p);
        const pathParts = this._parsePath(cleanPath);
        for (const part of pathParts) {
          if (part === '..') {
            if (parts.length > 0) {
              parts.pop();
            }
          } else {
            parts.push(part);
          }
        }
        return '/' + parts.join('/');
      }
      _splitPathAndArgs(pathWithArgs) {
        const [path, ...argsArray] = pathWithArgs.split(' -');
        const args = argsArray.length > 0 ? " -" + argsArray.join(' -') : null;
        return [path, args];
      }
      _parsePath(path) {
        return path.split('/').filter(p => p !== '' && p !== '.');
      }
      _resolvePath(path, startDir = this.globalRoot) {
        if (path === '/') return this.globalRoot;
        if (!path) return startDir;
        const parts = this._parsePath(this.getResolvedPath('/', path));
        let current = startDir;
        for (const part of parts) {
          const found = current.children.find(item => item.name === part);
          if (!found) return null;
          current = found;
        }
        return current;
      }
      touch(currentPath, name) {
        const targetDir = this._resolvePath(currentPath);
        if (!targetDir || targetDir.type !== 'directory') {
          throw new Error('Invalid path to create file');
        }
        if (!this.exists(targetDir.children, name)) {
          const newFile = this.createFile(name);
          targetDir.children.push(newFile);
          this.saveFileSystem();
          return true;
        }
        return false;
      }
      rm(currentPath, name, recursive = false) {
        const targetDir = this._resolvePath(currentPath);
        if (!targetDir || targetDir.type !== 'directory') {
          throw new Error('Invalid path');
        }
        const index = this.findIndex(targetDir.children, name);
        if (index === -1) throw new Error("File or directory does not exist");
        const item = targetDir.children[index];
        if (item.type === 'directory') {
          if (item.parameters.isSystem === true) throw new Error("Can't remove system directory");
          if (item.children.length > 0 && !recursive) return false;
        } else if (item.type === 'file' && item.parameters.isSystem === true) {
          throw new Error("Can't remove system file");
        }
        targetDir.children.splice(index, 1);
        this.saveFileSystem();
        return true;
      }
      async writeFile(fullPath, content, isBinary = false) {
        if (!fullPath) throw new Error('Full path is required to write a file.');
        const pathParts = fullPath.split('/').filter(p => p);
        if (pathParts.length === 0) throw new Error('Cannot write to root directory.');
        const fileName = pathParts.pop();
        const dirPath = '/' + pathParts.join('/');
        const targetDir = this._resolvePath(dirPath);
        if (!targetDir || targetDir.type !== 'directory') this.mkdirp(dirPath);
        const currentDir = this._resolvePath(dirPath);
        const existingFile = currentDir.children.find(f => f.name === fileName);
        if (existingFile) {
          if (existingFile.parameters.isSystem === true) {
            throw new Error("Can't overwrite system file");
          }
          existingFile.content = isBinary ? new Uint8Array(content) : String(content);
        } else {
          const newFile = this.createFile(fileName, content, { isBinary: isBinary });
          currentDir.children.push(newFile);
        }
        await this.saveFileSystem();
        return true;
      }

      readFile(fullPath, options = {}) {
        const file = this._resolvePath(fullPath);
        if (!file || file.type !== 'file') return null;
        if (typeof file.content === 'string' && file.content.startsWith('http')) {
          return file.content;
        }
        if (options === 'base64' && file.parameters.encoding === 'binary') {
          return btoa(String.fromCharCode(...file.content));
        }
        if (options.asText && file.parameters.encoding === 'binary') {
          const decoder = new TextDecoder(options.encoding || 'UTF-8');
          return decoder.decode(file.content);
        }
        return file.content;
      }
      mv(sourceFullPath, targetFullPath) {
        const source = this._resolvePath(sourceFullPath);
        if (!source) {
          throw new Error(`Source path '${sourceFullPath}' not found`);
        }
        const targetParentPath = targetFullPath.split('/').slice(0, -1).join('/');
        const targetParent = this._resolvePath(targetParentPath);
        const targetName = targetFullPath.split('/').pop() || source.name;
        if (source.parameters.isSystem === true) {
          throw new Error(`Can't move system ${source.type === 'file' ? 'file' : 'directory'}`);
        }
        if (!targetParent || targetParent.type !== 'directory') {
          throw new Error(`Invalid target path '${targetFullPath}'`);
        }
        if (source === targetParent.children.find(item => item.name === targetName)) {
          return true;
        }
        if (this.exists(targetParent.children, targetName)) {
          throw new Error(`Target '${targetName}' already exists`);
        }
        const sourceParent = this._findParent(source);
        if (!sourceParent) {
          throw new Error("Cannot move root directory");
        }
        sourceParent.children = sourceParent.children.filter(item => item !== source);
        source.name = targetName;
        targetParent.children.push(source);
        this.saveFileSystem();
        return true;
      }

      cp(currentPath, sourcePath, targetPath) {
        const source = this._resolvePath(sourcePath, this._resolvePath(currentPath));
        if (!source) throw new Error(`Source path '${sourcePath}' not found`);
        const targetParent = this._resolvePath(targetPath.split('/').slice(0, -1).join('/'), this._resolvePath(currentPath));
        const targetName = targetPath.split('/').pop() || source.name;
        if (!targetParent || targetParent.type !== 'directory') {
          throw new Error(`Invalid target path '${targetPath}'`);
        }
        if (this.exists(targetParent.children, targetName)) {
          throw new Error(`Target '${targetName}' already exists`);
        }
        const copy = this._deepCopy(source);
        copy.name = targetName;
        targetParent.children.push(copy);
        this.saveFileSystem();
        return true;
      }
      getItemSize(item) {
        if (item.type === "directory") return item.children ? item.children.length : 0;
        if (item.type === "file") {
          if (item.content instanceof Uint8Array) return item.content.length;
          if (typeof item.content === "string") return new TextEncoder().encode(item.content).length;
        }
        if (item.type === "link") return new TextEncoder().encode(item.target).length;
        return 0;
      }
      formatSize(bytes, type = null) {
        const units = {
          'B': 1,
          'KB': 1024,
          'MB': 1024 * 1024,
          'GB': 1024 * 1024 * 1024
        };
        if (type === "directory") return `${bytes} item${bytes !== 1 ? 's' : ''}`;
        if (bytes >= units['GB']) return `${(bytes / units['GB']).toFixed(2)} GB`;
        if (bytes >= units['MB']) return `${(bytes / units['MB']).toFixed(2)} MB`;
        if (bytes >= units['KB']) return `${(bytes / units['KB']).toFixed(2)} KB`;
        return `${bytes} B`;
      }
      async decodeContent(content, outputFormat = null) {
        if (content == null) return null;

        const isBlob = content instanceof Blob;
        const isUint8 = content instanceof Uint8Array;
        const isString = typeof content === 'string';
        const normalizedOutput = String(outputFormat || 'auto').toLowerCase();

        switch (normalizedOutput) {
          case 'text':
          case 'string':
            if (isString) return content;
            if (isBlob) return await content.text();
            if (isUint8) return new TextDecoder('utf-8').decode(content);
            throw new Error('Cannot convert this file content to text.');
          case 'blob':
            if (isBlob) return content;
            if (isUint8) return new Blob([content]);
            if (isString) return new Blob([content], { type: 'text/plain' });
            throw new Error('Cannot convert this file content to a Blob.');
          case 'arraybuffer':
            if (isBlob) return await content.arrayBuffer();
            if (isUint8) return content.buffer;
            if (isString) return new TextEncoder().encode(content).buffer;
            throw new Error('Cannot convert this file content to an ArrayBuffer.');
          case 'uint8array':
          case 'binary':
            if (isUint8) return content;
            if (isBlob) return new Uint8Array(await content.arrayBuffer());
            if (isString) return new TextEncoder().encode(content);
            throw new Error('Cannot convert this file content to binary data.');
          case 'url':
            if (isString) {
              const trimmed = content.trim();
              if (/^(https?:|data:)/i.test(trimmed)) {
                return trimmed;
              }
              return URL.createObjectURL(new Blob([trimmed], { type: 'text/plain' }));
            }
            if (isBlob) {
              return URL.createObjectURL(content);
            }
            if (isUint8) {
              return URL.createObjectURL(new Blob([content]));
            }
            throw new Error('Cannot convert this file content to a URL.');
          case 'auto':
            return content;
          default:
            throw new Error(`Unsupported decode format: ${outputFormat}`);
        }
      }
      getFileType(fileName) {
        for (const ext of Object.keys(fileSystem.typeMap).sort((a, b) => b.length - a.length)) {
          if (fileName.toLowerCase().endsWith(`.${ext}`)) {
            return fileSystem.typeMap[ext];
          }
        }
        return fileSystem.typeMap['file'];
      }
      openFile(pathWithArgs, fileType = 'auto') {
        const [path, args] = fileSystem._splitPathAndArgs(pathWithArgs);
        if (!path) {
          throw new Error('Please specify a file path');
        }
        const file = this._resolvePath(path);
        if (!file) {
          throw new Error(`File not found: ${path}`);
        }
        if (file.type !== 'file') {
          throw new Error('The specified path is not a file and cannot be opened');
        }
        if (fileType === 'auto') {
          fileType = this.getFileType(file.name).type;
        }

        const handler = fileSystem.fileHandlers[fileType];
        if (handler) {
          handler(args, path);
        } else {
          this.showAppPicker(pathWithArgs);
        }
      }
      showAppPicker(pathWithArgs) {
        const path = fileSystem._splitPathAndArgs(pathWithArgs)[0];
        const dialog = document.createElement('div');
        dialog.className = 'app-picker-dialog';
        const trimName = (name, maxLength = 20) => {
          if (!name) return '';
          const lastDotIndex = name.lastIndexOf('.');
          if (lastDotIndex <= 0) {
            if (name.length > maxLength) {
              return name.substring(0, maxLength) + '...';
            }
            return name;
          }
          const fileNameWithoutExtension = name.substring(0, lastDotIndex);
          const fileExtension = name.substring(lastDotIndex + 1);
          if (fileNameWithoutExtension.length > maxLength) {
            return fileNameWithoutExtension.substring(0, maxLength) + '...' + fileExtension;
          }
          return name;
        };
        dialog.innerHTML = `
  <div class="app-picker-content">
    <h3>Select application for '${trimName(path.split('/').pop())}':</h3>
    <div class="app-list">
      <button class="app-option" data-type="text">Text Editor</button>
      <button class="app-option" data-type="image">Image Viewer</button>
      <button class="app-option" data-type="video">Video Player</button>
      <button class="app-option" data-type="audio">Audio Player</button>
      <button class="app-option" data-type="executable">Execute</button>
    </div>
    <button class="cancel-btn">Cancel</button>
  </div>`;
        dialog.querySelectorAll('.app-option').forEach(btn => {
          btn.addEventListener('click', () => {
            dialog.remove();
            this.openFile(pathWithArgs, btn.dataset.type);
          });
        });
        dialog.querySelector('.cancel-btn').addEventListener('click', () => dialog.remove());
        dialog.addEventListener('click', (e) => {
          if (e.target === dialog) dialog.remove();
        });
        document.body.appendChild(dialog);
      }
      async unarchive(file, onProgress) {
        const zip = new JSZip();
        const files = [];
        try {
          const content = await this.decodeContent(file.content, 'arraybuffer');
          const loadedZip = await zip.loadAsync(content, {
            update: function (metadata) {
              if (onProgress) {
                onProgress(metadata.loaded, metadata.total, null);
              }
            }
          });
          const entries = Object.entries(loadedZip.files);
          let processed = 0;
          for (const [relativePath, zipEntry] of entries) {
            if (!zipEntry.dir) {
              const fileContent = await zipEntry.async('uint8array');
              files.push({ path: relativePath, content: fileContent, isDirectory: false });
            } else {
              files.push({ path: relativePath, isDirectory: true });
            }
            processed++;
            if (onProgress) {
              onProgress(processed, entries.length, relativePath);
            }
          }
          return files;
        } catch (error) {
          throw new Error('Please check if the zip archive is valid and not corrupted.');
        }
      }
      _deepCopy(node) {
        const copy = {
          name: node.name,
          type: node.type,
          parameters: node.parameters
        };
        if (node.type === 'directory') {
          copy.children = node.children.map(child => this._deepCopy(child));
        } else if (node.type === 'file') {
          copy.content = node.content;
        }
        return copy;
      }
      checkForbiddenChars(name) {
        const forbiddenChars = /[<>"/\\|-]/g;
        const matches = name.match(forbiddenChars);
        if (matches) {
          return [...new Set(matches)];
        }
        return false;
      }
    }

    class Desktop {
      constructor() {
        this.desktop = document.createElement('div');
        this.desktop.className = "desktop";
        document.body.appendChild(this.desktop);
        this.loadDesktopShortcuts();
      }
      loadDesktopShortcuts() {
        try {
          const desktopItems = fileSystem.ls('/bin/desktop');
          if (!desktopItems || desktopItems.length === 0) {
            return;
          }
          desktopItems.forEach(item => {
            this.createDesktopIcon(item);
          });
        } catch (e) {
          console.error('Error loading desktop shortcuts:', e);
        }
      }
      resolveShortcut(item) {
        const name = fileSystem._splitPathAndArgs(item.name)[0];
        if (item.type === 'link') {
          const linkTarget = String(item.target).trim();
          const targetFile = fileSystem._resolvePath(linkTarget);
          return {
            displayName: name,
            type: targetFile.type ?? null,
            targetPath: linkTarget,
            targetItem: targetFile || null,
            isLink: true
          };
        }
        let displayName = name;
        if (name.endsWith('.app')) {
          displayName = name.slice(0, -4);
        }
        return {
          displayName: displayName,
          type: item.type,
          targetPath: `/bin/desktop/${item.name}`,
          targetItem: item,
          isLink: false
        };
      }
      createDesktopIcon(item) {
        const shortcut = this.resolveShortcut(item);
        const targetItem = shortcut.targetItem;
        const icon = document.createElement("div");
        icon.className = "desktop-icon";
        let iconSvg;
        if (item.parameters?.icon) {
          iconSvg = item.parameters.icon;
        }
        else if (targetItem?.parameters?.icon) {
          iconSvg = targetItem.parameters.icon;
        }
        else if (targetItem) {
          if (targetItem.type === 'directory') {
            iconSvg = icons.folder;
          } else {
            const fileType = fileSystem.getFileType(targetItem.name).type;
            iconSvg = this.getIconForFileType(fileType);
          }
        } else {
          iconSvg = icons.file;
        }
        const image = document.createElement("div");
        image.className = "image";
        image.innerHTML = iconSvg;
        icon.appendChild(image);
        if (shortcut.isLink) {
          const linkBadge = document.createElement("div");
          linkBadge.className = "link-badge";
          linkBadge.innerHTML = icons.shortcut;
          image.appendChild(linkBadge);
        }
        const label = document.createElement("div");
        label.className = "label";
        label.textContent = shortcut.displayName;
        label.title = shortcut.displayName;
        icon.appendChild(label);
        if (shortcut.type === 'directory') {
          icon.addEventListener("click", () => this.handleFolderClick(shortcut.targetPath));
        } else {
          icon.addEventListener("click", () => this.handleFileClick(shortcut));
        }
        this.desktop?.appendChild(icon);
      }
      getIconForFileType(type) {
        const typeIconMap = {
          'directory': icons.folder,
          'video': icons.video,
          'audio': icons.audio,
          'text': icons.text,
          'image': icons.image,
          'html': icons.browser,
          'executable': icons.fileExecutable,
          'archive': icons.fileArchive,
          'file': icons.file
        };
        return typeIconMap[type] || icons.file;
      }
      handleFileClick(shortcut) {
        try {
          fileSystem.openFile(shortcut.targetPath);
        } catch (e) {
          new Dialog("Error", `Unable to open '${shortcut.targetItem.name}'`, e.message, "error", ['Ok'], 'Ok');
        }
      }
      handleFolderClick(path) {
        new FileExplorer(path);
      }
    }
  </script>
</body>
